name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy al servidor por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            # Ruta fija: en el servidor existe OTRO bot independiente
            # (/var/www/agenteconsultorio-admin, asistente.kaminar.pe) con el
            # mismo script de deploy. No usar `find` aquí: podría elegir el
            # proyecto equivocado y mezclar los dos bots.
            PROJECT_DIR=/var/www/fisiobot
            if [ ! -f "$PROJECT_DIR/deploy-agenteconsultorio.sh" ]; then
              echo "❌ No se encontró $PROJECT_DIR/deploy-agenteconsultorio.sh"
              exit 1
            fi
            echo "→ Proyecto: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            # Primero el pull: así el script de deploy que se ejecuta
            # es siempre el de esta versión, no el viejo del servidor.
            git pull --autostash origin main
            bash deploy-agenteconsultorio.sh "$PROJECT_DIR"
