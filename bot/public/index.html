<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba del agente — Dr. Michael Vásquez</title>
  <style>
    :root {
      --acento: #0d9488;
      --acento-oscuro: #0f766e;
      --acento-suave: #ccfbf1;
      --texto: #111827;
      --texto-sec: #6b7280;
      --borde: #e5e7eb;
      --fondo: #eef1f4;
      --sombra: 0 4px 24px rgba(16, 24, 40, .08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (min-width: 760px) {
      #app { height: min(860px, 92vh); border-radius: 20px; box-shadow: var(--sombra); border: 1px solid var(--borde); }
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--borde);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--acento), var(--acento-oscuro));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
      flex-shrink: 0;
    }
    header .titulo { flex: 1; min-width: 0; }
    header h1 { font-size: 15px; font-weight: 650; color: var(--texto); letter-spacing: -.01em; }
    header small { color: var(--texto-sec); display: block; font-size: 12px; margin-top: 1px; }
    header small::before {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 5px;
      vertical-align: 1px;
    }
    header button {
      background: #fff;
      border: 1px solid var(--borde);
      color: var(--texto-sec);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 550;
      transition: all .15s;
      flex-shrink: 0;
    }
    header button:hover { color: var(--acento-oscuro); border-color: var(--acento); background: #f0fdfa; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: aparecer .18s ease-out;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.agente {
      background: #fff;
      color: var(--texto);
      align-self: flex-start;
      border: 1px solid var(--borde);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
    }
    .msg.usuario {
      background: var(--acento);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.sistema {
      background: none;
      color: var(--texto-sec);
      align-self: center;
      font-size: 12px;
      text-align: center;
      max-width: 90%;
    }
    #escribiendo {
      display: none;
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--borde);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      gap: 4px;
      margin: 0 18px;
    }
    #escribiendo.visible { display: flex; }
    #escribiendo span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      animation: rebote 1.2s infinite;
    }
    #escribiendo span:nth-child(2) { animation-delay: .15s; }
    #escribiendo span:nth-child(3) { animation-delay: .3s; }
    @keyframes rebote {
      0%, 60%, 100% { transform: translateY(0); opacity: .5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    form {
      display: flex;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid var(--borde);
      align-items: center;
    }
    input {
      flex: 1;
      background: #f3f4f6;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--texto);
      font-size: 15px;
      outline: none;
      transition: all .15s;
    }
    input:focus { background: #fff; border-color: var(--acento); box-shadow: 0 0 0 3px rgba(13, 148, 136, .15); }
    button.enviar {
      background: var(--acento);
      border: none;
      border-radius: 50%;
      width: 46px; height: 46px;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    button.enviar:hover { background: var(--acento-oscuro); }
    button.enviar:active { transform: scale(.94); }
    button.enviar:disabled { background: #d1d5db; cursor: default; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="avatar">MV</div>
      <div class="titulo">
        <h1>Consultorio Dr. Michael Vásquez</h1>
        <small>Modo prueba — hablas con el asistente como si fueras un paciente</small>
      </div>
      <button id="reiniciar" title="Borra la conversación y empieza de nuevo">Reiniciar</button>
    </header>
    <div id="chat"></div>
    <div id="escribiendo"><span></span><span></span><span></span></div>
    <form id="form">
      <input id="entrada" type="text" placeholder="Escribe un mensaje como si fueras el paciente…" autocomplete="off" autofocus />
      <button class="enviar" type="submit">➤</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const entrada = document.getElementById('entrada');
    const escribiendo = document.getElementById('escribiendo');
    const botonEnviar = form.querySelector('button');

    function agregar(texto, clase) {
      const div = document.createElement('div');
      div.className = 'msg ' + clase;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function enviar(texto) {
      agregar(texto, 'usuario');
      entrada.value = '';
      entrada.disabled = true;
      botonEnviar.disabled = true;
      escribiendo.classList.add('visible');
      chat.appendChild(escribiendo);
      chat.scrollTop = chat.scrollHeight;
      try {
        const res = await fetch('/chat/mensaje', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto }),
        });
        const data = await res.json();
        if (data.respuesta) agregar(data.respuesta, 'agente');
        if (data.aviso) agregar(data.aviso, 'sistema');
      } catch {
        agregar('No se pudo contactar al servidor. ¿Está corriendo npm start?', 'sistema');
      } finally {
        escribiendo.classList.remove('visible');
        entrada.disabled = false;
        botonEnviar.disabled = false;
        entrada.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const texto = entrada.value.trim();
      if (texto) enviar(texto);
    });

    document.getElementById('reiniciar').addEventListener('click', async () => {
      await fetch('/chat/reiniciar', { method: 'POST' });
      chat.innerHTML = '';
      agregar('Conversación reiniciada. Escribe "Hola" para empezar.', 'sistema');
      entrada.focus();
    });

    agregar('Chat de prueba local. Escribe como si fueras un paciente (ej: "Hola, me duele la rodilla").', 'sistema');
  </script>
</body>
</html>
